name: Publish Docara Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      # Docara runs SIMAI Framework page composition with Node.js during the build.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Composer dependencies
        working-directory: docara
        run: composer install --no-interaction --prefer-dist --no-progress

      # The site keeps its historical public paths (/docs/en/...): the content
      # root source/docs/en is built with base_url <pages base>/docs/en/ and
      # published under docs/en/ of the Pages artifact. The committed
      # docara.json keeps "/" and no site_url for local builds.
      - name: Set the site base URL and site URL
        working-directory: docara
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          jq --arg base "${BASE_PATH%/}/docs/en/" --arg site "${SITE_URL%/}/docs/en/" \
            '.base_url = $base | .site_url = $site' docara.json > docara.json.pages
          mv docara.json.pages docara.json
          jq -r '.base_url, .site_url' docara.json

      - name: Build Docara site
        working-directory: docara
        run: php vendor/bin/docara build production

      - name: Verify static output
        working-directory: docara
        run: php vendor/bin/docara verify-static build_production

      - name: Assemble Pages artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site/docs/en
          cp -a docara/build_production/. _site/docs/en/
          target="${BASE_PATH%/}/docs/en/"
          cat > _site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>simai-env documentation</title>
          <meta http-equiv="refresh" content="0; url=${target}">
          <link rel="canonical" href="${target}">
          </head>
          <body><p><a href="${target}">simai-env documentation</a></p></body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
