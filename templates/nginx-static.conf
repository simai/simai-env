server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    index index.html;
    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;

    # Locations with their own add_header drop this one; repeat it there.
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    # Hidden files (.git, .env, .htpasswd) at any depth, and dumps/backups/logs.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type "text/plain";
        return 200 "OK\n";
    }

    # Static hosting the way GitHub Pages behaves: /dir/ serves dir/index.html,
    # /dir redirects to /dir/, /name serves name.html, 404.html is the error
    # page when the site ships one. A single-page app ships 200.html (a copy of
    # index.html) to answer every unknown path with it.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Caching by type and name ($simai_static_cache_control comes from
    # /etc/nginx/conf.d/simai-static.conf): HTML no-cache, hashed file names
    # immutable, everything else revalidates after ten minutes.
    add_header Cache-Control $simai_static_cache_control always;
    # Extensionless files (LICENSE, CNAME) are text.
    default_type text/plain;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

    location / {
        try_files $uri $uri/ $uri.html /200.html =404;
    }
}
