server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;

    add_header X-Content-Type-Options "nosniff" always;

    # Certificates of the redirecting name renew over http-01 here.
    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type "text/plain";
        return 200 "OK\n";
    }

    # Every other request goes to the target: with path and query, or to its
    # root page (--redirect-path drop).
    location / {
        return {{REDIRECT_CODE}} {{REDIRECT_TARGET}}{{REDIRECT_SUFFIX}};
    }
}
