server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;
    include /etc/nginx/simai-access/{{PROJECT_NAME}}[.]conf;
    include /etc/nginx/simai-custom/{{PROJECT_NAME}}[.]conf;

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 256m;

    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    # Hidden files (.htaccess, .htpasswd, .git, .env) at any depth, and dumps/backups/logs.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php{{PHP_VERSION}}-fpm-{{PHP_SOCKET_PROJECT}}.sock;
    }

    # Apache mode (site apache): every other request goes to Apache on
    # 127.0.0.1, which reads the site's .htaccess files and runs PHP through
    # the same PHP-FPM pool.
    location / {
        proxy_pass http://127.0.0.1:{{APACHE_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
