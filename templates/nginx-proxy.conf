server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;
    include /etc/nginx/simai-access/{{PROJECT_NAME}}[.]conf;
    include /etc/nginx/simai-custom/{{PROJECT_NAME}}[.]conf;

    add_header X-Content-Type-Options "nosniff" always;

    # Certificates renew over http-01 here, not through the service.
    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type "text/plain";
        return 200 "OK\n";
    }

    # Every other request goes to the service on this host (--upstream-port,
    # --upstream-path); WebSocket upgrades only with --websockets yes.
    location / {
        proxy_pass http://127.0.0.1:{{UPSTREAM_PORT}}{{UPSTREAM_PATH}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        {{WEBSOCKETS}}proxy_set_header Upgrade $http_upgrade;
        {{WEBSOCKETS}}proxy_set_header Connection "upgrade";
        {{WEBSOCKETS}}proxy_read_timeout 3600s;
    }
}
