<VirtualHost 127.0.0.1:{{APACHE_PORT}}>
    ServerName {{DOMAIN}}
{{SERVER_ALIAS}}    DocumentRoot {{DOC_ROOT}}
    DirectoryIndex index.php index.html
    ErrorLog /var/log/apache2/{{PROJECT_NAME}}.error.log

    <Directory {{DOC_ROOT}}>
        Options SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php{{PHP_VERSION}}-fpm-{{PHP_SOCKET_PROJECT}}.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
