server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;

    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    # Hidden files (.git, .env, .htpasswd) at any depth, and dumps/backups/logs,
    # even if the application would serve them.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type "text/plain";
        return 200 "OK\n";
    }

    # The application service (simai-app-{{PROJECT_NAME}}.service) listens on
    # 127.0.0.1:{{APP_PORT}}; it owns every other path.
    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 16m;
    }
}
