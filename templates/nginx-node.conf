server {
    listen 80;
    server_name {{SERVER_NAME}};
    root {{DOC_ROOT}};

    access_log /var/log/nginx/{{PROJECT_NAME}}.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.error.log;

    # Locations with their own add_header drop this one; repeat it there.
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        alias {{ACME_ROOT}}/.well-known/acme-challenge/;
        default_type "text/plain";
        allow all;
    }

    # Hidden files (.git, .env, .htpasswd) at any depth, and dumps/backups/logs,
    # even if the application would serve them.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:sql|sql\.gz|bak|old|orig|swp|log)$ {
        deny all;
    }

    location = /healthcheck {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type "text/plain";
        return 200 "OK\n";
    }

    # Routes come from the release's .simai/app.json (generated by simai-env):
    # a proxy to simai-app-{{PROJECT_NAME}}.service on 127.0.0.1:{{APP_PORT}},
    # or a static root with service routes, header sets and cache rules.
    include {{APP_ROUTES_FILE}};
}
